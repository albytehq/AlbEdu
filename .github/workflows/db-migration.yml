# AlbEdu DB Migration — dry-run on PR, apply on merge to main
name: DB Migration

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  dry-run:
    name: Dry-run migration syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Verify migrations syntax
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Checking: $f"
            sudo apt-get install -y postgresql-client >/dev/null 2>&1 || true
            if command -v psql &> /dev/null; then
              psql --parse-only -f "$f" 2>&1 || {
                echo "::error::Syntax error in $f"
                exit 1
              }
            else
              dollar_count=$(grep -c '\$\$' "$f" || echo 0)
              if [ $((dollar_count % 2)) -ne 0 ]; then
                echo "::error::Unbalanced \$\$ in $f"
                exit 1
              fi
              echo "Basic check passed for $f"
            fi
          done

  apply-to-production:
    name: Apply migration to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations via Supabase Management API
        continue-on-error: true  # Non-blocking: token may be expired
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "Applying: $f"
            SQL_CONTENT=$(cat "$f")
            RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'query': sys.stdin.read()}))" <<< "$SQL_CONTENT")")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "::notice::$f applied (HTTP $HTTP_CODE)"
            else
              echo "::warning::$f failed (HTTP $HTTP_CODE): $BODY"
              echo "::notice::Migration failed but continuing — apply manually in Supabase SQL Editor"
            fi
          done
          echo "::notice::Migration run complete (check warnings above)"
