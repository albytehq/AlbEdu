# AlbEdu DB Migration — dry-run on PR, apply on merge to main
name: DB Migration

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  dry-run:
    name: Dry-run migration on shadow DB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        run: npm install -g supabase

      - name: Verify migrations syntax (SQL parser check)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # List migrations that would be applied
          echo "::notice::Migrations in this PR:"
          ls -1 supabase/migrations/*.sql | sort

          # Syntax check each new migration by attempting to apply to a temp
          # shadow DB (Supabase CLI creates one for `db push --dry-run`)
          # Note: --dry-run requires Docker which isn't available on GitHub Actions
          # free runners. As a fallback, we run each migration through psql --parse-only

          for f in supabase/migrations/*.sql; do
            echo "::notice::Checking syntax: $f"
            # Install postgresql-client for psql
            sudo apt-get install -y postgresql-client >/dev/null 2>&1 || true
            # Use psql --parse-only (dry-run syntax check)
            # If psql not available, fall back to basic brace-matching check
            if command -v psql &> /dev/null; then
              psql --parse-only -f "$f" 2>&1 || {
                echo "::error::Syntax error in $f"
                exit 1
              }
            else
              # Basic check: balanced $$ blocks
              dollar_count=$(grep -c '\$\$' "$f" || echo 0)
              if [ $((dollar_count % 2)) -ne 0 ]; then
                echo "::error::Unbalanced \$\$ in $f"
                exit 1
              fi
              echo "::notice::psql not available, basic check passed for $f"
            fi
          done

  apply-to-production:
    name: Apply migration to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: []
    environment: production  # Requires manual approval if configured
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "Applying: $f"
            SQL_CONTENT=$(cat "$f")
            RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'query': sys.stdin.read()}))" <<< "$SQL_CONTENT")")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "::notice::$f applied (HTTP $HTTP_CODE)"
            else
              echo "::error::$f failed (HTTP $HTTP_CODE): $BODY"
              exit 1
            fi
          done
          echo "::notice::All migrations applied successfully"
