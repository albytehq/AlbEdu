name = "edu"
main = "dist/worker.js"
compatibility_date = "2024-09-25"
account_id = "d0a01513e24f58710cbff7dcb7b7d8ac"

# Workers.dev subdomain route (existing deployment)
workers_dev = true

# Note: Environment variables (SUPABASE_URL, SUPABASE_ANON_KEY, etc.) are
# managed via Cloudflare Dashboard and are NOT re-deployed here. This deploy
# only updates the worker.js code (which contains the cache TTL fix).
# Existing env vars are preserved across deploys.
#
# Cookie-auth secrets must be set in Cloudflare Dashboard → Workers → edu →
# Settings → Variables. Never put their values in this file:
#   JWT_SECRET                Supabase JWT secret (Settings → API → JWT Secret)
#   SUPABASE_URL              Supabase project URL
#   SUPABASE_ANON_KEY         Supabase anonymous key
#   SUPABASE_SERVICE_ROLE_KEY Service role key for privileged Worker calls

# Build step: bundle jose dependency via esbuild (Cloudflare Workers can't
# resolve bare module imports like 'jose' without a bundler).
# Run `npm install` in cloudflare-worker/ before `wrangler deploy`.
[build]
command = "npx esbuild worker.js --bundle --format=esm --outfile=dist/worker.js"
