<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="albedu-worker-base" content="https://edu.albyte-inc.workers.dev">
  <link rel="preload" href="../../src/shared/icons/icons.js" as="script">

  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://esm.sh https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://edu.albyte-inc.workers.dev https://esm.sh; worker-src 'self'; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; frame-src https://challenges.cloudflare.com; form-action 'self'">
    <title>Masuk Asesmen — AlbEdu</title>
    <meta name="description" content="AlbEdu - Masukkan kode akses untuk mengerjakan asesmen">
    <meta name="theme-color" content="#2563eb">
  <meta name="robots" content="noindex, nofollow">

    <!-- Favicon set -->
    <link rel="icon" type="image/x-icon" href="../../public/images/favicon/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../../public/images/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="../../public/images/favicon/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../public/images/favicon/apple-touch-icon.png">
    <link rel="manifest" href="../../public/manifest.json">

    <!-- ═══ CRITICAL CSS ═══ -->
    <script src="../../src/shared/head/critical-css.js"></script>

    <!-- ═══ Design tokens + design system ═══ -->
    <link rel="stylesheet" href="../../styles/tokens.css">
    <link rel="stylesheet" href="../../public/QNotify/ui/notify.css">
    <link rel="stylesheet" href="../../public/QNotify/ui/dialog.css">
    <link rel="stylesheet" href="../../public/QNotify/ui/label.css">
    <link rel="stylesheet" href="../../public/QNotify/ui/Readnote.css">
    <link rel="stylesheet" href="../../styles/albedu-v1.css">
    <link rel="stylesheet" href="../../styles/albedu-components.css">
    <link rel="stylesheet" href="../../styles/loading.css">
    <link rel="stylesheet" href="../../styles/pages/peserta-pages.css">

    <!-- ═══ Deferred shared modules ═══ -->
    <script defer src="../../src/shared/head/fonts.js"></script>
    <script defer src="../../src/shared/icons/icons.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="../../src/platform/supabase-client.js"></script>
    <script defer src="../../src/shared/resilience.js"></script>
    <script defer src="../../src/platform/repository.js"></script>
    <script defer src="../../src/security/sanitize.js"></script>
    <script defer src="../../src/shared/boot.js"></script>
    <script defer src="../../src/shared/error-boundary.js"></script>
    <script type="module" src="../../src/shared/qnotify-loader.js"></script>

    <!-- Auth baseline -->
    <script src="../../src/auth/security.js" defer></script>
    <script src="../../src/utils/ui.js" defer></script>
    <script src="../../src/auth/errors.js" defer></script>
    <script src="../../src/auth/user-helpers.js" defer></script>
    <script src="../../src/auth/main.js" defer></script>
    <script src="../../src/auth/byteward.js" defer></script>
</head>
<body class="peserta-page">
    <a href="#main-content" class="albedu-skip-link">Langsung ke konten utama</a>

    <main id="main-content" class="peserta-card" role="main" tabindex="-1">
        <!-- Logo -->
        <div class="peserta-logo">
            <img src="../../public/images/logo.svg" alt="AlbEdu" width="48" height="48">
        </div>

        <!-- Title -->
        <h1 class="peserta-title">Masuk Asesmen</h1>
        <p class="peserta-subtitle">Masukkan 6-digit kode akses yang diberikan guru</p>

        <!-- Cooldown banner -->
        <div class="peserta-cooldown" id="cooldown-banner">
            <span data-albedu-icon="schedule" class="albedu-icon--20" aria-hidden="true"></span>
            <span id="cooldown-text">Terlalu banyak percobaan. Coba lagi dalam 60 detik.</span>
        </div>

        <!-- Token inputs -->
        <div class="peserta-token-inputs" id="token-inputs">
            <input type="text" inputmode="numeric" maxlength="1" class="peserta-token-input token-input" data-index="0" autocomplete="off" aria-label="Digit 1">
            <input type="text" inputmode="numeric" maxlength="1" class="peserta-token-input token-input" data-index="1" autocomplete="off" aria-label="Digit 2">
            <input type="text" inputmode="numeric" maxlength="1" class="peserta-token-input token-input" data-index="2" autocomplete="off" aria-label="Digit 3">
            <input type="text" inputmode="numeric" maxlength="1" class="peserta-token-input token-input" data-index="3" autocomplete="off" aria-label="Digit 4">
            <input type="text" inputmode="numeric" maxlength="1" class="peserta-token-input token-input" data-index="4" autocomplete="off" aria-label="Digit 5">
            <input type="text" inputmode="numeric" maxlength="1" class="peserta-token-input token-input" data-index="5" autocomplete="off" aria-label="Digit 6">
        </div>

        <!-- Submit -->
        <button class="albedu-btn albedu-btn-primary albedu-btn-lg albedu-btn--block" id="token-submit" type="button" disabled>
            <span data-albedu-icon="arrow_forward" class="albedu-icon--20" aria-hidden="true"></span>
            <span id="submit-text">Masuk Asesmen</span>
        </button>

        <!-- Back link -->
        <a href="../../index.html" class="peserta-back-link">← Kembali ke beranda</a>
    </main>

    <!-- Security modules -->
    <script src="../../src/security/consent.js" defer></script>
    <!-- Page controller -->
    <script src="../../src/pages/assessment-entry.js" defer></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('../../public/service-worker.js').catch(() => {}));
      }
    </script>
</body>
</html>
